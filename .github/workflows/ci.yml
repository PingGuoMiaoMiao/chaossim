name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        uses: moonbitlang/setup-moonbit@main
        with:
          version: "0.1.20261104"

      - name: Check (deny warnings)
        run: moon check --target native --deny-warn

      - name: Test
        run: moon test --target native

      - name: Format check
        run: |
          moon fmt
          git diff --exit-code || (echo "::error::moon fmt produced changes; run 'moon fmt' locally" && exit 1)

  # The workspace members (adapters/, spikes/) are NOT part of the published
  # package - they depend on third-party libraries the library itself does
  # not. They are still built here on purpose: the adapter is the proof that
  # the library drives real protocol code, and a regression there is a real
  # regression. .moonignore keeps them out of `moon package`.
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        uses: moonbitlang/setup-moonbit@main
        with:
          version: "0.1.20261104"

      - name: Test workspace (library + mqtt adapter)
        run: moon test --target native

      - name: Run the MQTT fault-injection transcript
        run: moon run adapters/mqtt/bin --target native

      - name: Run the AMQP 1.0 fault-injection transcript
        run: moon run adapters/amqp1/bin --target native

      # docs/adopting.md is executable documentation: this member is a
      # third-party-shaped library written by following the guide, so a
      # stale guide fails CI instead of quietly misleading readers.
      - name: The adoption guide still works (adopting-drill)
        run: moon test examples/adopting-drill/drill/src --target native

      # Self-check against the published acceptance criteria. A WARN here is a
      # human should look; a FAIL means do not submit.
      # One command for the whole state of the submission: the six published
      # acceptance rules plus the document-vs-code consistency checks.
      - name: Self-check
        run: python tools/selfcheck.py

  # Documents drift away from the code faster than anyone notices. This checks
  # test-count claims against the real suite, ADR numbering for gaps/duplicates,
  # and that relative links resolve.
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        uses: moonbitlang/setup-moonbit@main
        with:
          version: "0.1.20261104"
      - name: Self-check
        run: python tools/selfcheck.py
